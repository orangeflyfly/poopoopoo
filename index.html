<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商業帝國：模擬開發 - 宗門崛起</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <header class="game-header">
            <div class="stat">📅 時間: <span id="game-time">08:00</span></div>
            <div class="stat">💰 資金: $<span id="money-display">5000</span></div>
            <div class="stat">👥 員工: <span id="staff-count">0</span></div>
            <div class="stat">🏢 評價: <span id="reputation">⭐ 1.0</span></div>
        </header>

        <div id="project-container">
            <label style="font-size: 12px; color: #38bdf8; display: block; margin-bottom: 5px;">🚀 當前專案進度</label>
            <div class="progress-bg">
                <div id="project-progress" class="progress-fill" style="width: 0%; background: #38bdf8; box-shadow: 0 0 10px #38bdf8;"></div>
            </div>
        </div>

        <main id="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div id="world-log">
                </div>
            
            <aside id="info-panel" class="hidden">
                <div class="panel-header">
                    <h2 id="p-name">職員資訊</h2>
                    <button class="close-btn" onclick="UI.hidePanel()">×</button>
                </div>
                <div class="panel-body">
                    <div class="stat-group">
                        <label>💡 智力 (IQ)</label>
                        <div class="progress-bg"><div id="bar-iq" class="progress-fill"></div></div>
                    </div>
                    <div class="stat-group">
                        <label>⚡ 效率 (EFF)</label>
                        <div class="progress-bg"><div id="bar-eff" class="progress-fill"></div></div>
                    </div>
                    <div class="stat-group">
                        <label>🔋 體力 (Stamina)</label>
                        <div class="progress-bg"><div id="bar-stamina" class="progress-fill"></div></div>
                    </div>
                    <div class="stat-group">
                        <label>😊 壓力值 (Stress)</label>
                        <div class="progress-bg"><div id="bar-stress" class="progress-fill stress"></div></div>
                    </div>
                    <p class="specialty-tag" id="p-specialty">專業：未定</p>
                </div>
            </aside>
        </main>

        <footer class="game-footer">
            <button class="menu-btn" onclick="Game.recruit()">🤝 招募員工 ($1000)</button>
            <button class="menu-btn" onclick="Game.buyPC()">💻 購置電腦 ($500)</button>
            <button class="menu-btn" onclick="Game.buyDesk()">🛋️ 購置桌椅 ($300)</button>
            <button class="menu-btn" onclick="Game.buyGym()">🏋️ 健身設施 ($800)</button>
            <button class="menu-btn" onclick="Game.buyDoor()">🚪 更改大門 ($500)</button>
            
            <button id="edit-mode-btn" class="menu-btn edit-btn" onclick="Game.toggleEditMode()">
                🛠️ 裝修模式：OFF
            </button>
        </footer>
    </div>

    <script src="Config.js"></script>
    <script src="Component.js"></script>
    <script src="Employee.js"></script>
    <script src="main.js"></script>
</body>
</html>
